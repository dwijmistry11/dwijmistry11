<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="sans-serif" role="img" aria-label="Dwij Mistry, Senior Software Engineer and Project Lead, Medical Imaging and AI">
  <defs>
    <radialGradient id="glow" cx="82%" cy="-8%" r="72%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#78a0aa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="300" rx="14" fill="#070b0e"/>
  <rect width="900" height="300" rx="14" fill="url(#grid)"/>
  <rect width="900" height="300" rx="14" fill="url(#glow)"/>

  <!-- crosshair reticle -->
  <g stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1">
    <line x1="838" y1="28" x2="838" y2="76"/>
    <line x1="814" y1="52" x2="862" y2="52"/>
    <circle cx="838" cy="52" r="7" fill="none"/>
  </g>

  <!-- eyebrow -->
  <text x="40" y="64" font-family="monospace" font-size="13" letter-spacing="3" fill="#2dd4bf">// SEGMENTATION &#183; RENDERING &#183; DEEP LEARNING</text>

  <!-- name -->
  <text x="38" y="127" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="600" letter-spacing="-0.5" fill="#f2f8f9">Dwij Mistry</text>

  <!-- role -->
  <text x="40" y="161" font-size="17" fill="#9fb2b8">Senior Software Engineer &amp; Project Lead &#183; <tspan fill="#2dd4bf" font-weight="600">Medical Imaging &amp; AI</tspan></text>

  <!-- readout cells -->
  <g>
    <rect x="40"  y="198" width="194" height="68" rx="10" fill="#0d1c1e" stroke="#1f4143"/>
    <rect x="248" y="198" width="194" height="68" rx="10" fill="#0d1c1e" stroke="#1f4143"/>
    <rect x="456" y="198" width="194" height="68" rx="10" fill="#0d1c1e" stroke="#1f4143"/>
    <rect x="664" y="198" width="194" height="68" rx="10" fill="#0d1c1e" stroke="#1f4143"/>

    <text x="56"  y="224" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#7f979d">EXPERIENCE</text>
    <text x="264" y="224" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#7f979d">PRODUCT</text>
    <text x="472" y="224" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#7f979d">STANDARD</text>
    <text x="680" y="224" font-family="monospace" font-size="10" letter-spacing="1.4" fill="#7f979d">BASED IN</text>

    <text x="56"  y="251" font-size="19" font-weight="600" fill="#eafcfa">8<tspan font-size="12" fill="#8fb6b3"> yrs</tspan></text>
    <text x="264" y="251" font-size="19" font-weight="600" fill="#eafcfa">MySegmenter</text>
    <text x="472" y="251" font-size="19" font-weight="600" fill="#eafcfa">IEC 62304</text>
    <text x="680" y="251" font-size="19" font-weight="600" fill="#eafcfa">Vadodara</text>
  </g>
</svg>
